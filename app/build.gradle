plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saobay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.saobay.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebRTC cho chiếu màn hình (MediaProjection -> PeerConnection)
   implementation 'io.github.webrtc-sdk:android:150.7871.01'
}
