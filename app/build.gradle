plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saobay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.saobay.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebRTC cho chiếu màn hình (MediaProjection -> PeerConnection)
    implementation 'org.webrtc:google-webrtc:1.0.32006'
    // SB_PULLREFRESH_20261019: kéo xuống để làm mới
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
