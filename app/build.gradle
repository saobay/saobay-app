plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saobay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.saobay.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

